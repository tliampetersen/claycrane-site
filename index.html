<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clay Crane Productions</title>
  <meta name="description" content="Clay Crane Productions — an independent mobile game studio. Thoughtful puzzle games, folded with care.">
  <meta property="og:title" content="Clay Crane Productions">
  <meta property="og:description" content="An independent mobile game studio. Thoughtful puzzle games, folded with care.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23b04a30' stroke-width='4' stroke-linejoin='round'%3E%3Cpath d='M14 70 L46 58 L38 34 Z' fill='%23b04a30' fill-opacity='0.2'/%3E%3Cpath d='M46 58 L38 34 L64 20 L58 46 Z' fill='%23b04a30' fill-opacity='0.4'/%3E%3Cpath d='M46 58 L58 46 L86 52 Z' fill='%23b04a30' fill-opacity='0.2'/%3E%3Cpath d='M64 20 L70 10'/%3E%3Cpath d='M14 70 L46 58 L86 52'/%3E%3Cpath d='M58 46 L64 78'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #faf7f2;
      --ink: #2b2620;
      --muted: #6f675e;
      --accent: #b04a30;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1916;
        --ink: #ece7df;
        --muted: #9a9188;
        --accent: #e07a5f;
        --card: #262220;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .crane {
      width: 96px;
      height: 96px;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .tagline {
      margin-top: 0.9rem;
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 34ch;
      line-height: 1.6;
    }
    .status {
      margin-top: 2.6rem;
      display: inline-block;
      background: var(--card);
      border: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
      border-radius: 999px;
      padding: 0.55rem 1.3rem;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .status b { color: var(--accent); font-weight: 600; }
    footer {
      margin-top: 4rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <svg class="crane" viewBox="0 0 100 100" role="img" aria-label="Origami crane logo">
    <g fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 70 L46 58 L38 34 Z" fill="var(--accent)" fill-opacity="0.14"/>
      <path d="M46 58 L38 34 L64 20 L58 46 Z" fill="var(--accent)" fill-opacity="0.28"/>
      <path d="M46 58 L58 46 L86 52 Z" fill="var(--accent)" fill-opacity="0.14"/>
      <path d="M64 20 L70 10"/>
      <path d="M14 70 L46 58 L86 52"/>
      <path d="M58 46 L64 78"/>
    </g>
  </svg>
  <h1>Clay Crane Productions</h1>
  <p class="tagline">An independent mobile game studio. Thoughtful puzzle games, folded with care.</p>
  <p class="status">First game <b>in the works</b> — see you on the App&nbsp;Store and Google&nbsp;Play soon.</p>
  <footer>
    <p>Contact: <a href="mailto:tliampetersen@gmail.com">tliampetersen@gmail.com</a></p>
    <p style="margin-top:0.4rem;"><a href="privacy.html">Privacy</a> · © 2026 Clay Crane Productions</p>
  </footer>
</body>
</html>
